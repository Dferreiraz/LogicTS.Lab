<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>LogicTS.Lab - Gerador de Labirinto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/jpeg" href="./src/img/LabirintosLogo.jpg">
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 font-sans">

    <div class="max-w-4xl mx-auto">
        <a href="../public/index.html" class="inline-flex items-center gap-2 text-gray-400 hover:text-white transition mb-8 group">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
            <span class="text-sm font-medium">Menu Principal</span>
        </a>

        <h1 class="text-3xl font-bold mb-2 text-emerald-400 flex items-center gap-3">
            <i data-lucide="map" class="w-8 h-8"></i>
            Gerador de Labirinto
        </h1>
        <p class="text-gray-400 mb-8">Gere labirintos procedurais com controle de tamanho e densidade.</p>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- Painel de Controle -->
            <div class="lg:col-span-1 bg-gray-800 p-6 rounded-xl border border-gray-700 space-y-6">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-300">Tamanho (5-30)</label>
                    <input type="number" id="inputTamanho" value="15" min="5" max="30" 
                           class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2 text-gray-300">Densidade de Paredes (0.1-0.7)</label>
                    <input type="range" id="inputDensidade" value="0.3" min="0.1" max="0.7" step="0.05"
                           class="w-full accent-emerald-500">
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>Aberto</span>
                        <span>Fechado</span>
                    </div>
                </div>

                <button id="btnGerar" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg transition flex items-center justify-center gap-2">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                    Gerar Novo Labirinto
                </button>

                <div class="pt-4 border-t border-gray-700 text-xs text-gray-500 space-y-1">
                    <p>🟦 Início</p>
                    <p>🟥 Destino</p>
                    <p>⬛ Parede</p>
                    <p>🟩 Caminho</p>
                </div>
            </div>

            <!-- Área do Labirinto -->
            <div class="lg:col-span-3 bg-gray-800 p-6 rounded-xl border border-gray-700">
                <div id="containerLabirinto" 
                     class="grid gap-px bg-gray-900 p-2 rounded-lg aspect-square max-h-[600px] overflow-hidden">
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="../dist/labirinto/src/main.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
