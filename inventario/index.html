<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>LogicTS.Lab - Inventário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="icon" type="image/jpeg" href="./src/img/InventLogo.jpg">
</head>
<body class="bg-gray-900 text-white min-h-screen p-10 font-sans">

    <div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded-lg shadow-xl relative">
        
        <!-- Botão Voltar -->
        <a href="../index.html" class="absolute top-4 left-4 flex items-center gap-2 text-gray-400 hover:text-white transition group">
            <i data-lucide="arrow-left" class="w-5 h-5 group-hover:-translate-x-1 transition-transform"></i>
            <span class="text-sm font-medium">Menu Principal</span>
        </a>

        <h1 class="text-3xl font-bold mb-6 text-yellow-400 mt-8 text-center">Organizador de Inventário</h1>

        <div class="mb-8 grid grid-cols-1 gap-4">
            <input type="text" id="nomeInput" placeholder="Nome do Item" class="p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-yellow-400">

            <select id="tipoSelect" class="p-2 rounded bg-gray-700 border border-gray-600">
                <option value="arma">Arma</option>
                <option value="pocao">Poção</option>
                <option value="escudo">Escudo</option>
            </select>

            <input type="number" id="pesoInput" placeholder="Peso (kg)" class="p-2 rounded bg-gray-700 border border-gray-600">

            <button id="btnAdicionar" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-4 rounded transition">
                Adicionar à Mochila
            </button>
        </div>

        <div id="feedback" class="mb-4 text-center font-bold"></div>

        <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Itens na Mochila:</h2>
        <ul id="listaItens" class="space-y-2">
        </ul>
    </div>
    
    <script type="module" src="./src/js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
